name: grading-tango

services:
  redis:
    image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [backend]

  tango:
    image: ${TANGO_IMAGE:?required}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      DOCKER_DEPLOYMENT: grading
      DOCKER_REDIS_HOSTNAME: redis
      RESTFUL_KEY: ${RESTFUL_KEY:?required}
      VMMS_NAME: kubernetes
      REUSE_VMS: "false"
      KUBERNETES_KUBECONFIG: /run/secrets/tango.kubeconfig
      KUBERNETES_NAMESPACE: grading
      KUBERNETES_RUNTIME_CLASS: grading-runsc
      KUBERNETES_SERVICE_ACCOUNT: grading-job
      KUBERNETES_INPUT_LIMIT: "716800"
      KUBERNETES_MAX_CONCURRENT_JOBS: "1"
    volumes:
      - tango-data:/opt/TangoService/Tango/courselabs
      - /run/grading/tango.kubeconfig:/run/secrets/tango.kubeconfig:ro
    networks: [backend]

networks:
  backend:

volumes:
  redis-data:
  tango-data:
