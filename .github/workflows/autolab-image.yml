name: Build Autolab image

on:
  push:
    branches: [main]
    paths:
      - autolab-config/**
      - .github/workflows/autolab-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  AUTOLAB_REPOSITORY: autolab/Autolab
  AUTOLAB_REF: 96006d532a392eeca2d350d1811f8e8ab9625bda
  AUTOLAB_VERSION: 3.0.2

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: platform

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.AUTOLAB_REPOSITORY }}
          ref: ${{ env.AUTOLAB_REF }}
          path: autolab

      - name: Install deployment configuration
        run: |
          cp platform/autolab-config/database.yml autolab/config/database.yml
          cp platform/autolab-config/autogradeConfig.rb autolab/config/autogradeConfig.rb
          cp platform/autolab-config/school.yml autolab/config/school.yml
          cp platform/autolab-config/newrelic.yml autolab/config/newrelic.yml
          cp autolab/config/environments/production.rb.template autolab/config/environments/production.rb
          cp platform/autolab-config/nginx.conf autolab/docker/nginx.conf
          cp platform/autolab-config/precompile-assets.sh autolab/docker/precompile-assets.sh
          cp platform/autolab-config/autolab-volumes.sh autolab/docker/autolab-volumes.sh
          # Scope public build placeholders to asset compilation, not image ENV.
          sed -i \
            -e '/^FROM /a COPY --chmod=0755 docker/autolab-volumes.sh /etc/my_init.d/20-autolab-volumes.sh' \
            -e '/^ENV SECRET_KEY_BASE=dummy_secret_key_base$/d' \
            -e 's|^RUN RAILS_ENV=production bundle exec rails assets:precompile$|RUN sh docker/precompile-assets.sh|' \
            -e '/^RUN rm \/etc\/nginx\/sites-enabled\/default$/a COPY docker/nginx.conf /etc/nginx/sites-enabled/autolab.conf' \
            autolab/Dockerfile

      - name: Install current Passenger repository signing key
        # The pinned Passenger base image predates the 2025 signing-key rotation.
        # Install the verified public key before upstream's first apt-get update.
        run: |
          curl --fail --silent --show-error --location \
            https://oss-binaries.phusionpassenger.com/auto-software-signing-gpg-key-2025.txt \
            --output "$RUNNER_TEMP/phusion-2025.asc"
          fingerprint=$(gpg --batch --show-keys --with-colons "$RUNNER_TEMP/phusion-2025.asc" | awk -F: '$1 == "fpr" {print $10; exit}')
          test "$fingerprint" = C6F448ED4BC80A4E95257250D870AB033FB45BD1
          gpg --batch --yes --dearmor --output autolab/docker/phusion-2025.gpg "$RUNNER_TEMP/phusion-2025.asc"
          sed -i '/^FROM /a COPY docker/phusion-2025.gpg /etc/apt/trusted.gpg.d/phusion-2025.gpg' autolab/Dockerfile

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: autolab
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/autolab:${{ env.AUTOLAB_VERSION }}-96006d5
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.AUTOLAB_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
